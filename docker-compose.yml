version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: kindle-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: kindle_db
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - kindle-network

  # Redis for caching (optional)
  redis:
    image: redis:7.2-alpine
    container_name: kindle-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - kindle-network

  # Backend API with Bun
  backend:
    build:
      context: .
      target: development
    container_name: kindle-backend-bun
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_URI: mongodb://admin:password123@mongodb:27017/kindle_db?authSource=admin
      JWT_SECRET: your-development-jwt-secret
      JWT_REFRESH_SECRET: your-development-refresh-secret
    ports:
      - '5000:5000'
    volumes:
      - .:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
      - redis
    networks:
      - kindle-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  kindle-network:
    driver: bridge